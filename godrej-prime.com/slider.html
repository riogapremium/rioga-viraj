<script>
   let currentIndex = 0;

// Get all the slides and pagination dots
const slides = document.querySelectorAll(".carousel-slide");
const totalSlides = slides.length;
const paginationContainer = document.querySelector(".pagination");

// Function to move the slide
function moveSlide(direction) {
  // Adjust the current index with loop functionality
  currentIndex = (currentIndex + direction + totalSlides) % totalSlides;

  // Move the carousel by updating the transform property
  const carousel = document.querySelector(".carousel");
  carousel.style.transform = translateX(-${currentIndex * 100}%);

  // Update the active dot
  updatePagination();
}

// Function to update pagination dots
function updatePagination() {
  // Remove the 'active' class from all dots
  const dots = document.querySelectorAll(".pagination-dot");
  dots.forEach(dot => dot.classList.remove("active"));

  // Add the 'active' class to the current dot
  dots[currentIndex].classList.add("active");
}

// Create pagination dots dynamically based on the number of slides
function createPagination() {
  for (let i = 0; i < totalSlides; i++) {
    const dot = document.createElement("div");
    dot.classList.add("pagination-dot");
    dot.addEventListener("click", () => {
      currentIndex = i;
      moveSlide(0); // Move to the clicked slide
    });
    paginationContainer.appendChild(dot);
  }

  // Set the first dot as active initially
  updatePagination();
}

// Optional: Auto slide every 5 seconds (5000 milliseconds)
setInterval(() => {
  moveSlide(1); // Move to the next slide
}, 5000);

// Create pagination on page load
createPagination();


</script>
